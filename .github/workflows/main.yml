name: Build and test

on:
  push:
    branches: [main, dotfiles]
  pull_request:
    branches: [main, dotfiles]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build-ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Download tun2socks for embedding
        run: make download-tun2socks

      - name: Install lint tools
        run: make install-lint-tools

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

  test-linux:
    name: Test (Linux)
    # Ubuntu 26's unpriv_bwrap profile denies the namespace capabilities under test.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download dependencies
        run: go mod download

      - name: Install Linux sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            socat \
            iproute2 \
            util-linux \
            xdg-dbus-proxy \
            libsecret-tools \
            uidmap \
            curl \
            netcat-openbsd \
            ripgrep
          # Configure subuid/subgid for the runner user (required for unprivileged user namespaces)
          echo "$(whoami):100000:65536" | sudo tee -a /etc/subuid
          echo "$(whoami):100000:65536" | sudo tee -a /etc/subgid

      - name: Verify sandbox dependencies
        run: |
          echo "=== Checking sandbox dependencies ==="
          bwrap --version
          socat -V | head -1
          echo "User namespaces enabled: $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo 'check not available')"
          echo "Kernel version: $(uname -r)"
          echo "uidmap installed: $(which newuidmap 2>/dev/null && echo yes || echo no)"
          echo "subuid configured: $(grep $(whoami) /etc/subuid 2>/dev/null || echo 'not configured')"
          echo "bwrap permissions: $(ls -la $(which bwrap))"
          echo "=== Testing bwrap basic functionality ==="
          bwrap --ro-bind / / -- /bin/echo "bwrap works!"
          echo "=== Testing bwrap with user namespace ==="
          bwrap --ro-bind / / --unshare-user --uid 0 --gid 0 -- /bin/echo "bwrap user namespace works!"

      - name: Download tun2socks for embedding
        run: make download-tun2socks

      - name: Require real network startup coverage
        timeout-minutes: 5
        env:
          GREYWALL_REQUIRE_NETWORK_TESTS: "1"
        run: |
          if [ ! -c /dev/net/tun ]; then
            sudo modprobe tun
          fi
          test -c /dev/net/tun
          go test -race ./internal/sandbox -run '^TestNetworkHelpers_' -count=1 -v

      - name: Diagnose network startup failures
        if: failure()
        run: |
          bwrap --version
          unshare --version
          for setting in /proc/sys/kernel/apparmor_restrict_*; do
            [ -f "$setting" ] || continue
            printf '%s: ' "$setting"
            if ! sudo cat "$setting"; then
              echo "Could not read this diagnostic setting; continuing."
            fi
          done
          for profile in /etc/apparmor.d/bwrap /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/unshare; do
            [ -f "$profile" ] || continue
            printf '\n%s\n' "$profile"
            if ! sudo cat "$profile"; then
              echo "Could not read this diagnostic profile; continuing."
            fi
          done
          if ! bwrap --unshare-net --ro-bind / / --dev /dev --proc /proc \
            --cap-drop ALL --cap-add CAP_SYS_ADMIN --cap-add CAP_SETPCAP \
            --cap-add CAP_NET_ADMIN --cap-add CAP_NET_BIND_SERVICE \
            -- bash -c '
              grep -E "^(Uid|Gid|CapPrm|CapEff|CapAmb):" /proc/self/status
              cat /proc/self/uid_map
              cat /proc/self/attr/current || true
              unshare --net -- ip -o link show
            '; then
            echo "Namespace capability canary failed; original network test failure remains fatal."
          fi
          sudo journalctl -k --no-pager -n 200 | grep -Ei 'apparmor|denied' || true

      - name: Run unit and integration tests
        run: make test-ci

      - name: Build binary for smoke tests
        run: make build-ci

      - name: Run smoke tests
        run: GREYWALL_TEST_NETWORK=1 ./scripts/smoke_test.sh ./greywall

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download dependencies
        run: go mod download

      - name: Install macOS dependencies
        run: |
          brew install ripgrep coreutils

      - name: Verify sandbox dependencies
        run: |
          echo "=== Checking sandbox dependencies ==="
          echo "macOS version: $(sw_vers -productVersion)"
          sandbox-exec -p '(version 1)(allow default)' /bin/echo "sandbox-exec works"

      - name: Run unit and integration tests
        run: make test-ci

      - name: Build binary for smoke tests
        run: make build-ci

      - name: Run smoke tests
        run: GREYWALL_TEST_NETWORK=1 ./scripts/smoke_test.sh ./greywall
